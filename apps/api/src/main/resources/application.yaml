spring:
  application:
    name: zawed-api
  datasource:
    # Railway's PostgreSQL service provides these variables. Tests and local runs replace the three
    # values with an embedded PostgreSQL (see README).
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:zawed}
    username: ${PGUSER:zawed}
    password: ${PGPASSWORD:}
    hikari:
      # The application never runs as the database owner. Every pooled connection switches to the
      # NOLOGIN role created by V3, which has only the grants it needs and is subject to row-level
      # security. Flyway keeps its own connection as the owner (spring.flyway.user below).
      connection-init-sql: SET ROLE zawed_app
  flyway:
    # Same credentials as the application, but through a separate, un-pooled connection, so the
    # migrations run as the owner and are not affected by the SET ROLE above.
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jackson:
    deserialization:
      # An unknown field in a request body is a mistake or a probe; neither is silently ignored.
      fail-on-unknown-properties: true
  lifecycle:
    # A deploy sends SIGTERM: stop taking requests, finish the ones in flight, then exit.
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    # Every management endpoint is switched off except health, so an exposure setting added later
    # (for example MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*) cannot publish env or heapdump.
    access:
      default: none
    web:
      # Health lives beside the API, not on a separate /actuator root: /api/v1/health is the only
      # management endpoint exposed.
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness says the process answers. Readiness says it can do its job, which needs the database.
        readiness:
          include: readinessState, db

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

zawed:
  environment: local
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  security:
    # Fixed values for a development machine and for tests only. ZawedProperties refuses every one
    # of them when the environment is deployed, so they cannot reach the internet by accident.
    jwt-secret: local-only-jwt-secret-do-not-deploy-0123456789abcdef
    data-key: bG9jYWwtb25seS1kYXRhLWtleS1ub3QtZm9yLXByb2Q=
    bootstrap-token: local-only-bootstrap-token-do-not-deploy
    cookie-secure: false

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

---
# Any environment reachable from the internet runs with this profile (SPRING_PROFILES_ACTIVE=deployed).
spring:
  config:
    activate:
      on-profile: deployed

# No defaults on purpose: a deploy that does not set these does not start (DeploymentGuard and
# the checks in ZawedProperties).
zawed:
  environment: ${ZAWED_ENVIRONMENT}
  cors:
    allowed-origins: ${ZAWED_CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret: ${ZAWED_JWT_SECRET}
    data-key: ${ZAWED_DATA_KEY}
    # Optional. Set it only for the first sign-in; remove it once a Super Admin exists.
    bootstrap-token: ${ZAWED_BOOTSTRAP_TOKEN:}
    cookie-secure: true

server:
  # Behind the platform's proxy the client address and scheme arrive in forwarded headers.
  forward-headers-strategy: native

logging:
  structured:
    format:
      # One JSON object per line, with the request id, so logs can be queried.
      console: ecs
